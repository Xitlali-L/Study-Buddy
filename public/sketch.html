<!--character Customizer-->

<!DOCTYPE html>

<html lang = "en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Study Buddy</title>
        <link rel = "icon" type = "images/favicon" href = "images/favicon.ico">
        <link rel = "stylesheet" href = "style.css">

    <body>
        <script src = https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js></script>

        <h1></h1>

        <div class = "navBar">Study Buddy</div>

        <div class = "main-container">

            <div class = "customBox"> 
                <img id ="players" class= "player-image" src = "" alt = "Players" />
                <img id ="tops" class= "tops-image" src = "" alt = "Tops" />
                <img id ="hats" class= "hats-image" src = "" alt = "Hats" />
            </div>

            <!--characters hats switches-->
            <div class = "hats-container">
                <div class = "carousel-buttons">
                    <button id = "0prevBtn">⬅</button> Hair <button id = "0nextBtn">➞</button>
                </div>
            </div>

            <!--characters tops switches-->
            <div class = "tops-container">
                <div class = "carousel-buttons">
                    <button id = "1prevBtn">⬅</button> Outfit <button id = "1nextBtn">➞</button>
                </div>
            </div>
            
            <!--character model switches-->
            <div class = "character-container">
                <div class = "carousel-buttons">
                    <button id = "3prevBtn">⬅</button> Character <button id = "3nextBtn">➞</button>
                </div>
            </div>

            <button class = "random-button" id = "random-btn"> Randomize! </button>

            <a href = "/play">
                <button class = "complete-button" id = "complete-button"> Done! </button>
            </a>
            
        </div>

        <!--<script src = "scripts/sketchA.js"></script>-->
        <script src = "scripts/switch.js"></script>
    </body>


</html>
